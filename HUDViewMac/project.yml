name: HUDViewMac
options:
  bundleIdPrefix: Iroiro
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 4BB235M4GL
    CODE_SIGN_STYLE: Automatic
targets:
  HUDViewMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # The radar, its places and their data are shared with the iPhone and Watch apps. The phone's compass (HeadingProvider), the
      # watch link and the iPhone-only map view are left out; Sources has a Mac HeadingProvider that is fed by the phone's frames.
      - path: ../Shared
        excludes:
          - HeadingProvider.swift
          - WatchLink.swift
          - RadarMapKitView.swift
          - HUDMath.swift
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: HUDViewMac
        LSMinimumSystemVersion: "26.0"
        NSLocalNetworkUsageDescription: Used to receive the location and heading that HUDView on your iPhone sends over this network.
        NSBonjourServices:
          - _hudview._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Iroiro.HUDViewMac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
